<!DOCTYPE html>
<html>
<head>
    <title>SMC_Status</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #leaflet-map { height: 600px; width: 100%; }
        /* 綠色實心圓點 */
        .solid-green-circle { 
            background-color: #28a745; 
            border-radius: 50%; 
            border: 2px solid white; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        /* 黃色三角形 */
        .yellow-triangle { 
            color: #FFD700; 
            font-size: 24px; 
            text-shadow: 1px 1px 1px #000; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="leaflet-map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const map = L.map('leaflet-map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        const points = {
            "OSS": [24.0868, 120.2074], "WTG20": [24.1138, 120.2275], "WTG24": [24.1126, 120.2353], 
            "WTG28": [24.1113, 120.2431], "WTG29": [24.0942, 120.2306]
            // ... (請保留您原有的完整點位列表)
        };

        function getOffsetPoint(p1, p2, ratio) {
            return [p1[0] + (p2[0] - p1[0]) * ratio, p1[1] + (p2[1] - p1[1]) * ratio];
        }

        // 定義特殊標記規則
        function getMarkersForLine(p1Name, p2Name, p1, p2) {
            const markers = [];
            
            // 規則 1: WTG28-WTG29 兩端綠圓
            if ((p1Name === 'WTG28' && p2Name === 'WTG29') || (p1Name === 'WTG29' && p2Name === 'WTG28')) {
                [0.15, 0.85].forEach(ratio => {
                    markers.push({ pos: getOffsetPoint(p1, p2, ratio), className: 'solid-green-circle', html: '' });
                });
            } 
            // 規則 2: WTG28-WTG24
            else if ((p1Name === 'WTG28' && p2Name === 'WTG24') || (p1Name === 'WTG24' && p2Name === 'WTG28')) {
                markers.push({ pos: getOffsetPoint(p1, p2, 0.15), className: 'solid-green-circle', html: '' }); // 靠近28
                markers.push({ pos: getOffsetPoint(p2, p1, 0.15), className: 'yellow-triangle', html: '▲' }); // 靠近24
            }
            // 規則 3: WTG24-WTG20
            else if ((p1Name === 'WTG24' && p2Name === 'WTG20') || (p1Name === 'WTG20' && p2Name === 'WTG24')) {
                markers.push({ pos: getOffsetPoint(p1, p2, 0.15), className: 'yellow-triangle', html: '▲' }); // 靠近24
            }
            return markers;
        }

        // 繪製邏輯 (請套入您原有的 allConnections 迴圈)
        // 範例展示片段：
        allConnections.forEach(pair => {
            const p1 = points[pair[0]], p2 = points[pair[1]];
            L.polyline([p1, p2], { color: 'black', weight: 2, dashArray: '5, 10' }).addTo(map);

            const markers = getMarkersForLine(pair[0], pair[1], p1, p2);
            markers.forEach(m => {
                L.marker(m.pos, {
                    icon: L.divIcon({ className: m.className, html: m.html, iconSize: [20, 20] }),
                    zIndexOffset: 10000
                }).addTo(map);
            });
        });

        map.fitBounds(L.latLngBounds(Object.values(points)), { padding: [50, 50] });
    </script>
</body>
</html>
