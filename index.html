<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SMC_Status</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { margin: 0; padding: 0; }
        #leaflet-map { height: 100vh; width: 100%; }
        
        .marker-icon { 
            background-color: #007bff; 
            clip-path: path('M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z');
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
        }
        
        .status-circle { border-radius: 50%; border: 1.5px solid white; box-shadow: 0 0 3px rgba(0,0,0,0.3); pointer-events: none; }
        .solid-circle { background-color: #28a745 !important; }
        .yellow-circle { background-color: #ffc107 !important; }

        /* 標籤樣式優化 */
        .label-text {
            font-size: 11px;
            font-weight: bold;
            color: #333;
            text-shadow: 0px 0px 4px white, 0px 0px 4px white; /* 增加文字白邊，提升清晰度 */
            white-space: nowrap;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="leaflet-map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <script>
        const map = L.map('leaflet-map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        const points = {
            "OSS": [24.0868, 120.2074], "WTG01": [24.1200, 120.1885], "WTG02": [24.0999, 120.1728], "WTG03": [24.0797, 120.1572],
            "WTG04": [24.1188, 120.1963], "WTG05": [24.0990, 120.1811], "WTG06": [24.0793, 120.1659], "WTG07": [24.0596, 120.1507],
            "WTG08": [24.1176, 120.2041], "WTG09": [24.0982, 120.1893], "WTG10": [24.0789, 120.1746], "WTG11": [24.0596, 120.1598],
            "WTG12": [24.1163, 120.2119], "WTG13": [24.0974, 120.1976], "WTG14": [24.0786, 120.1833], "WTG15": [24.0597, 120.1690],
            "WTG16": [24.1151, 120.2197], "WTG17": [24.0966, 120.2058], "WTG18": [24.0782, 120.1920], "WTG19": [24.0598, 120.1781],
            "WTG20": [24.1138, 120.2275], "WTG21": [24.0960, 120.2140], "WTG22": [24.0778, 120.2007], "WTG23": [24.0598, 120.1872],
            "WTG24": [24.1126, 120.2353], "WTG25": [24.0950, 120.2223], "WTG26": [24.0775, 120.2094], "WTG27": [24.0599, 120.1964],
            "WTG28": [24.1113, 120.2431], "WTG29": [24.0942, 120.2306], "WTG30": [24.0771, 120.2181], "WTG31": [24.0600, 120.2055]
        };

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0MC7HzAbxdqTrZNqIpaBtcyCIr8gV3vVm2pan8j2QFIlrHP2qzzqDb15LE9EqlrxcxQGuc6vphXDJ/pub?output=csv';

        // 繪圖邏輯保持不變
        Papa.parse(CSV_URL + '&t=' + new Date().getTime(), {
            download: true, header: true,
            complete: function(results) {
                // ... (連線與狀態圈圈程式碼相同，略過以節省篇幅) ...
                results.data.forEach(row => {
                    if (!row.Key) return;
                    const pair = row.Key.split('-');
                    if (!points[pair[0]] || !points[pair[1]]) return;
                    L.polyline([points[pair[0]], points[pair[1]]], { color: (row.Type === 'green') ? 'green' : 'black', weight: 2, dashArray: (row.Type === 'green') ? null : '5, 10' }).addTo(map);
                });

                // 優化後的標籤定位
                Object.keys(points).forEach(name => {
                    // 1. 風機圖示
                    L.marker(points[name], { 
                        icon: L.divIcon({ className: 'marker-icon', iconSize: [20, 25], iconAnchor: [10, 25] }) 
                    }).addTo(map);

                    // 2. 文字標籤定位參數設定
                    let anchor, offset;
                    if (name === 'OSS') {
                        anchor = [0, 12]; // OSS: 右側，垂直置中
                        offset = [10, 0];
                    } else if (points[name][0] > 24.095) {
                        anchor = [10, 35]; // 上方: 向上移 25px (35-10)
                        offset = [0, 0];
                    } else {
                        anchor = [10, -5]; // 下方: 向下移 10px ((-5)-(-15))
                        offset = [0, 0];
                    }

                    L.marker(points[name], {
                        icon: L.divIcon({
                            className: 'label-text',
                            html: name.replace('WTG', ''),
                            iconSize: [40, 20],
                            iconAnchor: anchor
                        }),
                        interactive: false
                    }).addTo(map);
                });
                map.fitBounds(L.latLngBounds(Object.values(points)), { padding: [50, 50] });
            }
        });
    </script>
</body>
</html>
