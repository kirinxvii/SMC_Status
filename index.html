<!DOCTYPE html>
<html>
<head>
    <title>SMC_Status</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #leaflet-map { height: 900px; width: 100%; }
        /* 實心綠色圓點樣式 */
        .solid-circle { 
            background-color: #28a745; /* 綠色背景 */
            border-radius: 50%;      /* 圓形 */
            border: 2px solid white;  /* 白色邊框增加質感 */
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="leaflet-map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const map = L.map('leaflet-map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        const points = {
            "OSS": [24.0868, 120.2074], "WTG01": [24.1200, 120.1885], "WTG02": [24.0999, 120.1728], "WTG03": [24.0797, 120.1572],
            "WTG04": [24.1188, 120.1963], "WTG05": [24.0990, 120.1811], "WTG06": [24.0793, 120.1659], "WTG07": [24.0596, 120.1507],
            "WTG08": [24.1176, 120.2041], "WTG09": [24.0982, 120.1893], "WTG10": [24.0789, 120.1746], "WTG11": [24.0596, 120.1598],
            "WTG12": [24.1163, 120.2119], "WTG13": [24.0974, 120.1976], "WTG14": [24.0786, 120.1833], "WTG15": [24.0597, 120.1690],
            "WTG16": [24.1151, 120.2197], "WTG17": [24.0966, 120.2058], "WTG18": [24.0782, 120.1920], "WTG19": [24.0598, 120.1781],
            "WTG20": [24.1138, 120.2275], "WTG21": [24.0960, 120.2140], "WTG22": [24.0778, 120.2007], "WTG23": [24.0598, 120.1872],
            "WTG24": [24.1126, 120.2353], "WTG25": [24.0950, 120.2223], "WTG26": [24.0775, 120.2094], "WTG27": [24.0599, 120.1964],
            "WTG28": [24.1113, 120.2431], "WTG29": [24.0942, 120.2306], "WTG30": [24.0771, 120.2181], "WTG31": [24.0600, 120.2055]
        };

        const greenLines = [['WTG02','WTG05'],['WTG05','WTG06'],['WTG06','WTG03'],['WTG03','WTG07'],['WTG07','WTG11'],['WTG11','WTG10'],['WTG22','WTG18'],['WTG23','WTG27'],['WTG27','WTG31'],['WTG31','WTG30'],['OSS','WTG10'],['OSS','WTG09']];
        const allConnections = [['WTG09','WTG08'],['WTG08','WTG04'],['WTG04','WTG01'],['WTG01','WTG02'],['WTG02','WTG05'],['WTG05','WTG06'],['WTG06','WTG03'],['WTG03','WTG07'],['WTG07','WTG11'],['WTG11','WTG10'],['WTG22','WTG18'],['WTG18','WTG14'],['WTG14','WTG15'],['WTG15','WTG19'],['WTG19','WTG23'],['WTG23','WTG27'],['WTG27','WTG31'],['WTG31','WTG30'],['WTG30','WTG26'],['WTG17','WTG13'],['WTG13','WTG12'],['WTG12','WTG16'],['WTG16','WTG20'],['WTG20','WTG24'],['WTG24','WTG28'],['WTG28','WTG29'],['WTG29','WTG25'],['WTG25','WTG21'],['OSS','WTG10'],['OSS','WTG09'],['OSS','WTG17'],['OSS','WTG21'],['OSS','WTG22'],['OSS','WTG26']];

        function getOffsetPoint(p1, p2, ratio) {
            return [p1[0] + (p2[0] - p1[0]) * ratio, p1[1] + (p2[1] - p1[1]) * ratio];
        }

        allConnections.forEach(pair => {
            const isGreen = greenLines.some(g => (g[0] === pair[0] && g[1] === pair[1]) || (g[0] === pair[1] && g[1] === pair[0]));
            const p1 = points[pair[0]], p2 = points[pair[1]];

            L.polyline([p1, p2], {
                color: isGreen ? 'green' : 'black',
                weight: 2,
                dashArray: isGreen ? null : '5, 10'
            }).addTo(map);

            if (!isGreen && (pair.includes('WTG28') && pair.includes('WTG29'))) {
                const ratio = 0.15;
                const nearP1 = getOffsetPoint(p1, p2, ratio);
                const nearP2 = getOffsetPoint(p2, p1, ratio);

                [nearP1, nearP2].forEach(pos => {
                    L.marker(pos, {
                        icon: L.divIcon({ className: 'solid-circle', iconSize: [20, 20] }),
                        interactive: false,
                        zIndexOffset: 10000
                    }).addTo(map);
                });
            }
        });

        Object.keys(points).forEach(name => L.marker(points[name]).bindTooltip(name).addTo(map));
        map.fitBounds(L.latLngBounds(Object.values(points)), { padding: [50, 50] });
    </script>
</body>
</html>
